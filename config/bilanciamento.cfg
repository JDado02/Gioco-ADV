; =============================================================================
;  ORDA ZERO — FILE UNICO DI BILANCIAMENTO
; =============================================================================
;  Tutti i numeri che regolano la difficoltà del gioco stanno qui.
;  Puoi modificarli senza toccare il codice: al prossimo avvio (o alla
;  prossima build dell'APK) il gioco userà i nuovi valori.
;
;  Regole di sintassi:
;   - le righe che iniziano con ";" sono commenti e vengono ignorate;
;   - i numeri decimali usano il PUNTO (es. 1.5, non 1,5);
;   - non cancellare nessuna chiave: se ne manca una, il gioco lo segnala
;     nel log e usa 0 al suo posto.
;
;  Unità di misura: distanze in "metri di gioco" (un soldato è alto ~1.1),
;  velocità in metri al secondo, tempi in secondi.
;
;  Le sezioni per varianti di nemici, boss e potenziamenti verranno
;  aggiunte nelle fasi successive.
; =============================================================================


[folla]

; Numero di unità con cui inizia la partita.
unita_iniziali=8

; VISUAL_UNIT_CAP: numero massimo di soldati DISEGNATI a schermo.
; Oltre questo numero il contatore continua a salire ma la folla visibile
; resta uguale. La potenza di fuoco usa comunque il numero REALE di unità.
visual_unit_cap=10

; Distanza tra un soldato e l'altro nella formazione.
spaziatura_unita=1.05

; Sensibilità del trascinamento: 1.0 = trascinare il dito per tutta la
; larghezza dello schermo sposta la folla per tutta la larghezza della pista.
sensibilita_trascinamento=1.2

; Rapidità con cui i soldati si ricompattano in formazione (più alto = più scatto).
velocita_ricompattamento=10.0


[pista]

; Velocità con cui la folla avanza lungo la pista (la strada scorre).
; 0 = la folla resta FERMA e sono nemici, cancelli e barricate a venirle
; incontro (impostazione attuale, come nel video di riferimento).
velocita_avanzamento=0.0

; Larghezza della pista percorribile.
larghezza=14.0


[armi]

; Ordine in cui si sbloccano le armi. Si parte dalla prima; ogni ostacolo
; bonus "arma" abbattuto fa salire di un livello, fino all'ultima.
; Ogni nome deve avere la sua sezione [arma_<nome>] qui sotto.
sequenza=["fucile", "mitragliatrice", "lanciarazzi"]

; Significato dei parametri di ogni arma:
;   nome                 = testo mostrato a schermo
;   colpi_al_secondo     = colpi sparati da OGNI unità (reale, non solo visibile)
;   danno_per_colpo      = danno di un colpo di una singola unità
;   velocita_proiettile  = velocità dei proiettili
;   gittata              = distanza massima percorsa da un proiettile
;   raggio_proiettile    = tolleranza di mira (metà larghezza utile del colpo)
;   raggio_esplosione    = 0 = colpo normale; > 0 = esplode al primo impatto e
;                          fa danno a TUTTI i nemici entro questo raggio
;   dimensione           = grandezza del proiettile a schermo (1 = normale)
;   colore               = colore del proiettile (rosso, verde, blu, opacità)

[arma_fucile]
nome="FUCILE"
colpi_al_secondo=1.5
danno_per_colpo=1.0
velocita_proiettile=38.0
gittata=28.0
raggio_proiettile=0.15
raggio_esplosione=0.0
dimensione=1.0
colore=Color(1, 0.86, 0.35, 1)

[arma_mitragliatrice]
nome="MITRAGLIATRICE"
colpi_al_secondo=4.0
danno_per_colpo=0.6
velocita_proiettile=46.0
gittata=30.0
raggio_proiettile=0.18
raggio_esplosione=0.0
dimensione=0.9
colore=Color(0.55, 1, 0.95, 1)

[arma_lanciarazzi]
nome="LANCIARAZZI"
colpi_al_secondo=1.1
danno_per_colpo=2.5
velocita_proiettile=28.0
gittata=34.0
raggio_proiettile=0.25
raggio_esplosione=1.0
dimensione=1.8
colore=Color(1, 0.45, 0.15, 1)


[nemici]

; Punti vita del nemico base (colpi da danno 1 necessari per ucciderlo):
;   vita = vita_base + vita_incremento_per_ondata × ondata
vita_base=4.0
vita_incremento_per_ondata=0.8

; Velocità di camminata del nemico verso la folla (si somma alla velocità
; di avanzamento della pista):
;   velocità = velocita_base + velocita_incremento_per_ondata × ondata
; senza mai superare velocita_massima.
velocita_base=6.5

; Aumento di velocità per ogni ondata.
velocita_incremento_per_ondata=0.1

; Tetto massimo alla velocità di camminata, qualunque sia l'ondata.
velocita_massima=10.0

; Il nemico che arriva a contatto con la folla muore nello scontro e uccide
; delle unità (vedi unita_uccise_al_contatto di ogni variante qui sotto).

; Velocità con cui i nemici si spostano di lato per inseguire la folla.
; Più alta = più difficile schivarli.
velocita_laterale=1.6


; Distanza (davanti alla folla) a cui compaiono i nemici.
distanza_comparsa=55.0

; Raggio di ingombro di un nemico (per colpi e contatti).
raggio=0.58

; Numero massimo di gruppi di nemici contemporaneamente in campo (prestazioni;
; un'orda conta come un gruppo solo). Se il limite è raggiunto, le comparse
; vengono ritardate, mai cancellate.
max_nemici_attivi=150


; --- VARIANTI DI NEMICI ---------------------------------------------------
; Ogni variante parte dai valori di [nemici] (vita e velocità dell'ondata)
; e li moltiplica:
;   ondata_sblocco         = prima ondata in cui la variante può comparire
;   peso                   = quanto spesso compare rispetto alle altre
;                            (es. peso 1.0 contro 0.5: compare il doppio)
;   vita_moltiplicatore    = × vita del nemico base dell'ondata
;   velocita_moltiplicatore= × velocità del nemico base dell'ondata
;   scala                  = grandezza a schermo (1 = normale)
;   unita_uccise_al_contatto = unità uccise da OGNI membro che arriva a contatto

[nemico_base]
ondata_sblocco=1
peso=1.0
vita_moltiplicatore=1.0
velocita_moltiplicatore=1.0
scala=1.0
unita_uccise_al_contatto=1

; Veloce (arancione): poca vita ma corre verso di te.
[nemico_veloce]
ondata_sblocco=4
peso=0.4
vita_moltiplicatore=0.55
velocita_moltiplicatore=1.7
scala=0.85
unita_uccise_al_contatto=1

; Corazzato (grigio con scudo): lento ma servono molti colpi.
[nemico_corazzato]
ondata_sblocco=7
peso=0.3
vita_moltiplicatore=4.0
velocita_moltiplicatore=0.7
scala=1.3
unita_uccise_al_contatto=2

; Tiratore (viola, fucile lungo): si ferma a distanza e spara alla folla.
; I suoi colpi vanno dritti verso il punto in cui eri quando ha sparato:
; spostandoti li schivi.
[nemico_tiratore]
ondata_sblocco=10
peso=0.2
vita_moltiplicatore=1.6
velocita_moltiplicatore=0.8
scala=1.0
unita_uccise_al_contatto=1
; Distanza dalla folla a cui si ferma per sparare.
distanza_tiro=24.0
; Secondi tra un colpo e l'altro.
intervallo_tiro=2.4
velocita_proiettile=13.0
; Unità uccise da ogni colpo che va a segno.
unita_uccise_per_colpo=1


[orde]

; Le ORDE sono gruppi compatti di nemici base o veloci con un contatore
; sopra (come la massa rossa delle pubblicità). Si combattono come tanti
; nemici insieme: ogni colpo toglie vita al gruppo e il numero scende.
; Se un'orda arriva a contatto, ogni membro rimasto uccide le sue unità.

; Prima ondata con le orde.
ondata_inizio=3
; Probabilità che una comparsa sia un'orda invece di una squadretta.
probabilita=0.35
; Membri di un'orda = dimensione_base + dimensione_incremento_per_ondata × ondata
dimensione_base=5
dimensione_incremento_per_ondata=1.0
dimensione_massima=60
; Soldati DISEGNATI al massimo per ogni orda (il contatore mostra il numero vero).
membri_visibili_massimi=12


[ondate]

; Numero di nemici per ondata = nemici_base + nemici_incremento × ondata
nemici_base=8
nemici_incremento=4

; Secondi in cui vengono fatti comparire tutti i nemici di un'ondata.
; Poiché i nemici crescono a ogni ondata, compaiono sempre più fitti.
durata_comparsa=10.0

; Massimo numero di nemici che compaiono affiancati nello stesso istante.
dimensione_massima_squadra=4

; Pausa (secondi) tra la fine di un'ondata e l'inizio della successiva.
pausa_tra_ondate=2.5


[cancelli]

; Secondi tra un "evento" e il successivo. Ogni evento è una coppia di
; cancelli oppure un ostacolo bonus da distruggere.
intervallo=6.5

; Attesa prima del primo evento della partita.
ritardo_iniziale=3.0

; Velocità con cui cancelli e barricate vengono incontro alla folla
; (si somma all'eventuale velocita_avanzamento della pista).
velocita=6.0

; Probabilità (da 0 a 1) che un evento sia un ostacolo bonus invece di una coppia.
probabilita_ostacolo_bonus=0.3

; Limiti al numero di unità dopo aver attraversato un cancello.
; unita_minime_dopo_malus = 1 significa che un malus non può mai portarti
; a zero unità (mettilo a 0 per rendere i malus mortali).
unita_minime_dopo_malus=1
; Tetto massimo di unità: evita che i moltiplicatori rendano il gioco banale.
unita_massime=250

; --- Frequenza dei malus ---
; In ogni coppia normale un cancello è sempre un bonus; l'altro è un malus
; con questa probabilità:
;   probabilità = malus_probabilita_base + malus_incremento_per_ondata × ondata
; senza mai superare malus_probabilita_massima (il LIMITE).
malus_probabilita_base=0.4
malus_incremento_per_ondata=0.015
malus_probabilita_massima=0.7

; Probabilità che una coppia sia "ingannevole": i due cancelli danno risultati
; vicini ma diversi, calcolati sulle unità che hai in quel momento
; (es. ×2 contro +5 quando hai 4 unità). Bisogna fare il conto!
; Se la coppia ingannevole capita come malus, è "il male minore":
; ÷N contro -N, e conviene scegliere quello che fa perdere meno.
probabilita_coppia_ingannevole=0.25

; Le coppie con due malus compaiono solo da questa ondata in poi, e mai
; due volte di fila (così una sfortuna non è mai senza rimedio).
ondata_minima_coppie_malus=5

; --- Valori dei cancelli bonus ---
; Probabilità che un bonus sia un ×N (altrimenti è un +N).
peso_moltiplica=0.25
; +N: N casuale tra somma_min e somma_max, più somma_crescita_per_ondata × ondata.
somma_min=2
somma_max=6
somma_crescita_per_ondata=0.5
; ×N: N casuale tra moltiplica_min e moltiplica_max.
moltiplica_min=2
moltiplica_max=2

; --- Valori dei cancelli malus ---
; Probabilità che un malus sia un ÷N (altrimenti è un -N).
peso_dividi=0.35
; -N: N casuale tra sottrai_min e sottrai_max, più sottrai_crescita_per_ondata × ondata.
sottrai_min=2
sottrai_max=6
sottrai_crescita_per_ondata=0.6
; ÷N: N casuale tra dividi_min e dividi_max (il risultato è arrotondato per difetto).
dividi_min=2
dividi_max=2


[ostacoli_bonus]

; Ostacoli fermi sulla pista, con i punti vita scritti sopra. Se li abbatti
; sparando prima che ti superino, ottieni la ricompensa scritta sopra.
; Mentre spari a loro, però, non spari ai nemici!

; Punti vita = vita_base + vita_incremento_per_ondata × ondata
vita_base=35.0
vita_incremento_per_ondata=6.0

; Larghezza dell'ostacolo (la pista è larga [pista] larghezza).
larghezza=2.6

; Probabilità che la ricompensa sia un bonus temporaneo invece dell'arma
; successiva. Quando hai già l'arma migliore, la ricompensa è sempre temporanea.
probabilita_bonus_temporaneo=0.35


[bonus_temporanei]

; FUOCO RAPIDO: moltiplica i colpi al secondo per un certo tempo (secondi).
fuoco_rapido_moltiplicatore=2.0
fuoco_rapido_durata=8.0

; COLPI POTENZIATI: moltiplica il danno per un certo tempo (secondi).
colpi_potenziati_moltiplicatore=2.0
colpi_potenziati_durata=8.0
