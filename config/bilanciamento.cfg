; =============================================================================
;  ORDA ZERO — FILE UNICO DI BILANCIAMENTO
; =============================================================================
;  Tutti i numeri che regolano la difficoltà del gioco stanno qui.
;  Puoi modificarli senza toccare il codice: al prossimo avvio (o alla
;  prossima build dell'APK) il gioco userà i nuovi valori.
;
;  Regole di sintassi:
;   - le righe che iniziano con ";" sono commenti e vengono ignorate;
;   - i numeri decimali usano il PUNTO (es. 1.5, non 1,5);
;   - non cancellare nessuna chiave: se ne manca una, il gioco lo segnala
;     nel log e usa 0 al suo posto.
;
;  Unità di misura: distanze in "metri di gioco" (un soldato è alto ~1.1),
;  velocità in metri al secondo, tempi in secondi.
;
;  Le sezioni per cancelli, armi, varianti di nemici, boss e potenziamenti
;  verranno aggiunte nelle fasi successive.
; =============================================================================


[folla]

; Numero di unità con cui inizia la partita.
; (In Fase 1 non ci sono ancora cancelli per guadagnarne altre: il valore è
;  sopra VISUAL_UNIT_CAP apposta, per poter vedere il limite visivo in azione.)
unita_iniziali=15

; VISUAL_UNIT_CAP: numero massimo di soldati DISEGNATI a schermo.
; Oltre questo numero il contatore continua a salire ma la folla visibile
; resta uguale. La potenza di fuoco usa comunque il numero REALE di unità.
visual_unit_cap=10

; Distanza tra un soldato e l'altro nella formazione.
spaziatura_unita=0.8

; Sensibilità del trascinamento: 1.0 = trascinare il dito per tutta la
; larghezza dello schermo sposta la folla per tutta la larghezza della pista.
sensibilita_trascinamento=1.2

; Rapidità con cui i soldati si ricompattano in formazione (più alto = più scatto).
velocita_ricompattamento=10.0


[pista]

; Velocità con cui la folla avanza da sola lungo la pista.
velocita_avanzamento=6.0

; Larghezza della pista percorribile.
larghezza=9.0


[arma]

; Arma di partenza (il fucile). Le altre armi arriveranno in Fase 2.

; Colpi al secondo sparati da OGNI unità (reale, non solo visibile).
colpi_al_secondo=1.5

; Danno di un singolo colpo di una singola unità.
danno_per_colpo=1.0

; Velocità dei proiettili.
velocita_proiettile=38.0

; Distanza massima percorsa da un proiettile prima di sparire.
gittata=28.0

; Metà della larghezza "utile" del proiettile per colpire (tolleranza di mira).
raggio_proiettile=0.15


[nemici]

; Punti vita del nemico base (colpi da danno 1 necessari per ucciderlo).
vita_base=4.0

; Velocità di camminata del nemico verso la folla (si somma alla velocità
; di avanzamento della pista):
;   velocità = velocita_base + velocita_incremento_per_ondata × ondata
; senza mai superare velocita_massima.
velocita_base=2.0

; Aumento di velocità per ogni ondata.
velocita_incremento_per_ondata=0.12

; Tetto massimo alla velocità di camminata, qualunque sia l'ondata.
velocita_massima=5.0

; Velocità con cui i nemici si spostano di lato per inseguire la folla.
; Più alta = più difficile schivarli.
velocita_laterale=1.6

; Unità del giocatore uccise da un nemico che arriva a contatto.
; Il nemico muore nello scontro.
unita_uccise_al_contatto=1

; Distanza (davanti alla folla) a cui compaiono i nemici.
distanza_comparsa=55.0

; Raggio di ingombro di un nemico (per colpi e contatti).
raggio=0.45

; Numero massimo di nemici contemporaneamente in campo (prestazioni).
; Se il limite è raggiunto, le comparse vengono ritardate, mai cancellate.
max_nemici_attivi=150


[ondate]

; Numero di nemici per ondata = nemici_base + nemici_incremento × ondata
nemici_base=8
nemici_incremento=4

; Secondi in cui vengono fatti comparire tutti i nemici di un'ondata.
; Poiché i nemici crescono a ogni ondata, compaiono sempre più fitti.
durata_comparsa=10.0

; Massimo numero di nemici che compaiono affiancati nello stesso istante.
dimensione_massima_squadra=4

; Pausa (secondi) tra la fine di un'ondata e l'inizio della successiva.
pausa_tra_ondate=2.5
